<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘의 플래너</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .wrap { max-width: 1240px; margin: 26px auto; padding: 0 18px; }
    .topnav { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
    .topnav .sp { flex: 1; }
    .sheet { padding: 30px 30px 30px 44px; }
    .head { display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 12px; margin-bottom: 22px; }
    .head .date { font-family: 'Nanum Pen Script', cursive; font-size: 54px; line-height: .9; }
    .head .date small { font-size: 26px; color: var(--muted); margin-left: 8px; }
    .head .ddays { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
    .head .ddays .chip { font-size: 13px; padding: 3px 10px; }
    .quote { font-family: 'Nanum Pen Script', cursive; font-size: 22px; color: var(--muted); margin: -10px 0 18px; }

    .cols { display: grid; grid-template-columns: 300px 1fr 290px; gap: 26px; }
    .card { border: 1.5px solid var(--line); border-radius: 12px; padding: 16px; background: #fff; margin-bottom: 18px; position: relative; }
    .card h3 { margin: 0 0 10px; }

    /* 타임라인 */
    .tl { position: relative; margin-left: 42px; border-left: 1.5px solid var(--line); }
    .tl .hr { position: absolute; left: -42px; width: calc(100% + 42px); border-top: 1px dashed var(--line); font-size: 11px; color: var(--muted); }
    .tl .hr span { position: absolute; top: -8px; left: 0; background: var(--paper); padding-right: 4px; }
    .blk {
      position: absolute; left: 4px; right: 4px; border-radius: 6px; padding: 3px 7px; font-size: 12px; overflow: hidden;
      line-height: 1.3; border-left: 4px solid var(--c); background: color-mix(in srgb, var(--c) 16%, #fff); cursor: pointer;
    }
    .blk.fixed { cursor: default; border-left-color: #b9ae99; color: #7d7466;
      background: repeating-linear-gradient(-45deg, #f6f2ea 0 6px, #efe9dd 6px 12px); }
    .blk.fixed.exam { border-left-color: var(--accent); color: var(--accent); background: repeating-linear-gradient(-45deg, #fdeee9 0 6px, #fae2da 6px 12px); font-weight: bold; }
    .blk.tiny { white-space: nowrap; text-overflow: ellipsis; padding-top: 1px; padding-bottom: 0; }
    .blk.half { right: 50%; } .blk.half2 { left: 50%; }
    .blk.done { opacity: .5; text-decoration: line-through; }
    .blk b { font-weight: normal; opacity: .75; margin-right: 4px; }
    .nowline { position: absolute; left: -6px; right: 0; border-top: 2px solid var(--sun); z-index: 5; }
    .nowline::before { content: ''; position: absolute; left: -4px; top: -5px; width: 8px; height: 8px; border-radius: 50%; background: var(--sun); }

    /* 할 일 */
    .todo-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .todos { list-style: none; padding: 0; margin: 0; }
    .todo {
      display: flex; gap: 12px; align-items: flex-start; padding: 12px 4px; border-bottom: 1px solid var(--rule);
      transition: background .2s;
    }
    .todo:hover { background: #fffaf0; }
    .check { position: relative; flex: none; margin-top: 2px; cursor: pointer; }
    .check input { position: absolute; opacity: 0; width: 0; height: 0; }
    .check .box { display: block; width: 24px; height: 24px; border: 2px solid var(--ink); border-radius: 5px; transform: rotate(-3deg); background: #fff; }
    .check input:checked + .box { background: var(--sage); border-color: var(--sage); }
    .check input:checked + .box::after { content: '✓'; color: #fff; position: absolute; left: 5px; top: -2px; font-size: 20px; font-weight: bold; }
    .check input:focus-visible + .box { outline: 2px solid var(--sky); outline-offset: 2px; }
    .tbody { flex: 1; min-width: 0; }
    .ttop { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 3px; flex-wrap: wrap; }
    .ttitle { font-size: 16px; }
    .todo.done .ttitle { text-decoration: line-through; text-decoration-color: var(--accent); text-decoration-thickness: 2px; color: var(--muted); }
    .tnote { font-size: 13px; color: #6f675b; margin-top: 4px; background: #fff8e5; display: inline-block; padding: 2px 8px; border-radius: 4px; }
    .tact { display: flex; gap: 2px; opacity: .25; transition: .15s; }
    .todo:hover .tact, .todo:focus-within .tact { opacity: 1; }
    .tact button { background: none; border: none; cursor: pointer; font-size: 14px; padding: 4px 6px; color: var(--muted); border-radius: 6px; }
    .tact button:hover { background: #f3ede1; color: var(--ink); }
    .kind { font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
    .add-form { display: grid; grid-template-columns: 90px 90px 120px 1fr auto; gap: 8px; align-items: end; margin-top: 14px; }
    .empty-todo { text-align: center; padding: 30px 10px; color: var(--muted); }

    /* 진행률 도넛 */
    .donut { width: 120px; height: 120px; border-radius: 50%; margin: 4px auto 10px; display: grid; place-items: center;
      background: conic-gradient(var(--sage) calc(var(--p) * 1%), #f1ebde 0); transition: .4s; }
    .donut > div { width: 92px; height: 92px; border-radius: 50%; background: #fff; display: grid; place-items: center; text-align: center; }
    .donut b { font-family: 'Nanum Pen Script', cursive; font-size: 38px; line-height: 1; display: block; }
    .donut small { font-size: 11px; color: var(--muted); }
    .kv { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; border-bottom: 1px dashed var(--line); }

    /* 타이머 */
    .timer { text-align: center; }
    .timer .t { font-family: 'Nanum Pen Script', cursive; font-size: 62px; line-height: 1; margin: 4px 0 6px; letter-spacing: 2px; }
    .timer .modes { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; }
    .timer .modes button.on { background: var(--butter); }
    .timer .tbar { height: 6px; background: #f1ebde; border-radius: 99px; overflow: hidden; margin-bottom: 12px; }
    .timer .tbar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width 1s linear; }
    .timer select { margin-bottom: 10px; }

    /* 회고 */
    .moods { display: flex; gap: 4px; justify-content: space-between; margin-bottom: 8px; }
    .moods button { font-size: 24px; background: none; border: 2px solid transparent; border-radius: 50%; width: 42px; height: 42px; cursor: pointer; filter: grayscale(.8); opacity: .6; }
    .moods button.on { border-color: var(--butter); filter: none; opacity: 1; background: #fff8e5; }
    textarea.lined {
      width: 100%; min-height: 132px; border: none; outline: none; resize: vertical; background: transparent;
      font-family: 'Nanum Pen Script', cursive; font-size: 22px; line-height: 28px;
      background-image: linear-gradient(transparent 27px, var(--rule) 27px); background-size: 100% 28px;
    }

    @media (max-width: 1080px) { .cols { grid-template-columns: 260px 1fr; } .cols > .side { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0 18px; } }
    @media (max-width: 720px) {
      .cols { grid-template-columns: 1fr; } .cols > .tlcol { order: 2; }
      .sheet { padding: 22px 16px; } .rings { display: none; }
      .add-form { grid-template-columns: 1fr 1fr; } .add-form .full { grid-column: 1 / -1; }
      .head .date { font-size: 42px; }
    }
    @media print {
      body { background: #fff; }
      .topnav, .no-print, .tact, .add-form, .timer-card, .rings, .tape { display: none !important; }
      .wrap { margin: 0; max-width: none; }
      .paper { box-shadow: none; }
      .cols { grid-template-columns: 250px 1fr 220px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="topnav">
      <a class="btn small" id="prevDay">‹ 어제</a>
      <a class="btn small" id="todayBtn">오늘</a>
      <a class="btn small" id="nextDay">내일 ›</a>
      <input type="date" class="btn small" id="jump" style="padding:3px 10px" aria-label="날짜 이동" />
      <span class="sp"></span>
      <a class="btn small ghost" href="index.html" id="calLink">📅 달력으로</a>
      <button class="btn small ghost" onclick="window.print()">🖨 인쇄</button>
    </nav>

    <article class="paper sheet">
      <div class="rings"></div>
      <div class="tape"></div>
      <header class="head">
        <div class="date" id="dateTitle"></div>
        <div class="ddays" id="ddays"></div>
      </header>
      <p class="quote" id="quote"></p>

      <div class="cols">
        <!-- 타임라인 -->
        <section class="tlcol">
          <h3 class="section-title"><span class="hl">타임테이블</span></h3>
          <div class="tl" id="timeline"></div>
        </section>

        <!-- 할 일 목록 -->
        <section>
          <div class="todo-head">
            <h3 class="section-title" style="margin:0"><span class="hl">오늘 할 일</span></h3>
            <span class="muted" id="todoCount" style="font-size:13px"></span>
            <span style="flex:1"></span>
            <button class="btn small ghost no-print" id="hideDone">완료 숨기기</button>
          </div>
          <ul class="todos" id="todos"></ul>

          <form class="add-form no-print" id="addForm">
            <label class="field" style="margin:0">시작<input class="input" type="time" name="start" /></label>
            <label class="field" style="margin:0">끝<input class="input" type="time" name="end" /></label>
            <label class="field" style="margin:0">과목<select class="input" name="exam_id"></select></label>
            <label class="field full" style="margin:0">할 일 직접 추가<input class="input" name="title" placeholder="예) 영어 단어 50개 외우기" maxlength="120" required /></label>
            <button class="btn small primary full">+ 추가</button>
          </form>

          <div class="card no-print" style="margin-top:22px;background:#fbf8f1">
            <b>계획이 밀렸나요?</b>
            <p class="muted" style="font-size:13px;margin:6px 0 10px">완료하지 못한 진도는 그대로 이어서, 내일부터 남은 시험까지 계획을 다시 짜 드려요. (완료한 일정·직접 추가한 일정은 그대로 유지)</p>
            <button class="btn small sage" id="replan">🔄 내일부터 계획 다시 짜기</button>
          </div>
        </section>

        <!-- 사이드: 달성률, 타이머, 회고 -->
        <aside class="side">
          <div class="card">
            <h3 class="section-title"><span class="hl">달성률</span></h3>
            <div class="donut" id="donut" style="--p:0"><div><span><b id="pct">0%</b><small id="pctSub"></small></span></div></div>
            <div class="kv"><span>계획한 공부</span><b id="planMin">-</b></div>
            <div class="kv"><span>완료한 공부</span><b id="doneMin">-</b></div>
            <div class="kv"><span>타이머 집중</span><b id="focusMin">-</b></div>
          </div>

          <div class="card timer timer-card">
            <h3 class="section-title"><span class="hl">집중 타이머</span></h3>
            <div class="modes" id="modes">
              <button class="btn small" data-m="25">25분</button>
              <button class="btn small" data-m="50">50분</button>
              <button class="btn small" data-m="5">휴식 5분</button>
            </div>
            <select class="input" id="timerTask" aria-label="집중할 할 일"></select>
            <div class="t" id="tDisplay">25:00</div>
            <div class="tbar"><i id="tBar"></i></div>
            <button class="btn primary small" id="tStart">▶ 시작</button>
            <button class="btn small" id="tReset">↺ 초기화</button>
          </div>

          <div class="card">
            <h3 class="section-title"><span class="hl">오늘의 회고</span></h3>
            <div class="moods" id="moods">
              <button data-v="😆" title="최고">😆</button><button data-v="🙂" title="좋음">🙂</button>
              <button data-v="😐" title="보통">😐</button><button data-v="😣" title="힘듦">😣</button><button data-v="😴" title="피곤">😴</button>
            </div>
            <textarea class="lined" id="memo" placeholder="잘한 점, 아쉬운 점, 내일 할 것…"></textarea>
            <div style="text-align:right"><span class="muted" id="memoState" style="font-size:12px"></span></div>
          </div>
        </aside>
      </div>
    </article>
  </div>

  <script src="common.js"></script>
  <script src="planner.js"></script>
</body>
</html>
