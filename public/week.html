<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주간 플래너</title>
  <meta name="theme-color" content="#ece5d6" />
  <link rel="stylesheet" href="style.css" />
  <script src="common.js"></script>
  <script src="presets.js"></script>
  <style>
    .wrap { max-width: 1480px; margin: 26px auto; padding: 0 18px; }
    .topnav { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
    .topnav .sp { flex: 1; }
    .sheet { padding: 30px 30px 30px 44px; }
    .head { display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 12px; margin-bottom: 18px; }
    .head .date { font-family: var(--font-hand), 'Nanum Pen Script', cursive; font-size: calc(48px * var(--hand-scale)); line-height: .9; }
    .head .date small { font-size: 24px; color: var(--muted); margin-left: 8px; }
    .head .ddays { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
    .head .ddays .chip { font-size: 13px; padding: 3px 10px; }

    /* 집중 타이머 (한 줄) */
    .wtimer { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); padding: 10px 14px; margin-bottom: 18px; }
    .wtimer h3 { margin: 0; }
    .wtimer .t { font-family: var(--font-hand), 'Nanum Pen Script', cursive; font-size: calc(40px * var(--hand-scale)); line-height: 1; letter-spacing: 2px; min-width: 92px; text-align: center; }
    .wtimer select.input { width: auto; max-width: 280px; margin: 0; font-size: 13px; }
    .wtimer #timerTask { flex: 1 1 220px; max-width: 360px; }
    .wtimer .modes { display: flex; gap: 6px; }
    .wtimer .modes button.on { background: var(--butter); }
    .wtimer .tbar { flex: 1 1 100%; height: 5px; background: var(--track); border-radius: 99px; overflow: hidden; }
    .wtimer .tbar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width 1s linear; }
    .wtimer .noise { display: flex; align-items: center; gap: 6px; margin-left: auto; }
    .wtimer #noiseVol { width: 90px; accent-color: var(--accent); }

    /* 7일 */
    .wk-scroll { overflow-x: auto; }
    .wk { display: grid; grid-template-columns: repeat(7, minmax(158px, 1fr)); border-top: 1.5px solid var(--ink); border-left: 1px solid var(--line); min-width: 1106px; }
    .wd { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px 8px 10px; min-height: 300px; display: flex; flex-direction: column; min-width: 0; }
    .wd.past { background-color: color-mix(in srgb, var(--soft) 50%, transparent); }
    .wd.today { background-color: var(--note); box-shadow: inset 0 3px 0 var(--accent); }
    .wd-head { display: flex; align-items: center; gap: 6px; padding-bottom: 6px; border-bottom: 1.5px solid var(--ink); margin-bottom: 6px; }
    .wd-head .dn { font-size: 13px; color: var(--muted); }
    .wd-head .num { font-size: 16px; width: 28px; height: 28px; line-height: 28px; text-align: center; border-radius: 50%; }
    .wd.today .num { background: var(--accent); color: var(--on-accent); }
    .wd.sun .dn, .wd.sun .num { color: var(--sun); } .wd.sat .dn, .wd.sat .num { color: var(--sat); }
    .wd.today.sun .num, .wd.today.sat .num { color: var(--on-accent); }
    .wd-head .todaytag { font-size: 11px; color: var(--accent); }
    .wd-head a { margin-left: auto; font-size: 12px; color: var(--muted); text-decoration: none; white-space: nowrap; }
    .wd-head a:hover { color: var(--accent); text-decoration: underline; }
    .sticker { font-size: 12px; padding: 2px 7px; border-radius: 4px; background: var(--c); color: #fff; align-self: flex-start; transform: rotate(-2deg);
      box-shadow: 1px 1px 0 rgba(0,0,0,.12); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 4px; }
    .sticker::before { content: '★ '; }
    .fx { font-size: 11px; color: var(--muted); line-height: 1.4; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wtodos { list-style: none; padding: 0; margin: 0; flex: 1; }
    .wt { display: flex; gap: 7px; align-items: flex-start; padding: 7px 0; border-bottom: 1px solid var(--rule); }
    .wt.focus { background: var(--hover); box-shadow: -3px 0 0 var(--accent); }
    .check { position: relative; flex: none; margin-top: 1px; cursor: pointer; }
    .check input { position: absolute; opacity: 0; width: 0; height: 0; }
    .check .box { display: block; width: 20px; height: 20px; border: 2px solid var(--ink); border-radius: 5px; transform: rotate(-3deg); background: var(--card); }
    .check input:checked + .box { background: var(--sage); border-color: var(--sage); }
    .check input:checked + .box::after { content: '✓'; color: var(--on-accent); position: absolute; left: 4px; top: -3px; font-size: 17px; font-weight: bold; }
    .check input:focus-visible + .box { outline: 2px solid var(--sky); outline-offset: 2px; }
    .wbody { flex: 1; min-width: 0; }
    .wmeta { font-size: 11px; color: var(--muted); display: flex; gap: 5px; align-items: center; flex-wrap: wrap; margin-bottom: 2px; }
    .wmeta .chip { font-size: 11px; padding: 0 6px; }
    .wtitle { font-size: 13px; line-height: 1.35; word-break: keep-all; overflow-wrap: anywhere; }
    .wt.done .wtitle { text-decoration: line-through; text-decoration-color: var(--accent); color: var(--muted); }
    .wact { display: flex; flex-direction: column; gap: 0; opacity: .3; transition: .15s; }
    .wt:hover .wact, .wt:focus-within .wact { opacity: 1; }
    .wact button { background: none; border: none; cursor: pointer; font-size: 12px; padding: 2px 4px; color: var(--muted); border-radius: 6px; }
    .wact button:hover { background: var(--soft); color: var(--ink); }
    .wempty { font-size: 12px; color: var(--muted); padding: 14px 0; text-align: center; }
    .wcount { font-size: 11px; color: var(--muted); margin-top: 6px; display: flex; align-items: center; gap: 6px; }
    .wcount .bar { flex: 1; height: 5px; background: var(--track); border-radius: 99px; overflow: hidden; }
    .wcount .bar i { display: block; height: 100%; background: var(--sage); border-radius: 99px; }

    @media (max-width: 760px) {
      .sheet { padding: 22px 14px; } .rings { display: none; }
      .wk { grid-template-columns: 1fr; min-width: 0; }
      .wd { min-height: 0; }
      .head .date { font-size: 36px; }
      .wact { flex-direction: row; opacity: 1; }
    }

    /* ── 인쇄: A4 가로 한 장 (week.js가 내용 높이에 맞춰 --pz 배율을 계산) ── */
    #printSheet { position: absolute; left: -99999px; top: 0; visibility: hidden; width: calc(277mm / var(--pz, 1)); color: #222; font-size: 8.5pt; line-height: 1.35; }
    #printRuler { position: absolute; left: -99999px; top: 0; visibility: hidden; height: 186mm; width: 1mm; }
    .pw-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; border-bottom: 2px solid #222; padding-bottom: 4px; margin-bottom: 6px; }
    .pw-date { font-family: var(--font-hand), 'Nanum Pen Script', cursive; font-size: calc(24pt * var(--hand-scale)); line-height: 1; }
    .pw-dd { font-size: 8.5pt; text-align: right; }
    .pw-dd b { margin-left: 8px; font-weight: normal; }
    .pw-grid { display: grid; grid-template-columns: repeat(7, 1fr); border-left: 1px solid #bbb; border-top: 1px solid #bbb; }
    .pw-day { border-right: 1px solid #bbb; border-bottom: 1px solid #bbb; padding: 4px 5px 6px; min-width: 0; }
    .pw-dh { font-weight: bold; border-bottom: 1.2px solid #222; padding-bottom: 2px; margin-bottom: 3px; display: flex; justify-content: space-between; gap: 4px; }
    .pw-dh span { font-weight: normal; font-size: 7.5pt; }
    .pw-fx { font-size: 7pt; color: #555; margin-bottom: 3px; }
    .pw-t { display: flex; gap: 4px; padding: 2.5px 0; border-bottom: 1px solid #ddd; break-inside: avoid; }
    .pw-box { flex: none; width: 9pt; height: 9pt; border: 1.2px solid #222; border-radius: 2px; margin-top: 1px; position: relative; }
    .pw-box.on::after { content: '✓'; position: absolute; left: 0; top: -4px; font-size: 9pt; font-weight: bold; }
    .pw-m { font-size: 7pt; color: #555; }
    .pw-m b { color: #222; border-left: 3px solid var(--c, #999); padding-left: 3px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .pw-t.done .pw-title { text-decoration: line-through; color: #888; }
    .pw-none { color: #999; font-size: 7.5pt; padding: 6px 0; }
    @media print {
      @page { size: A4 landscape; margin: 10mm; }
      html, body { background: #fff !important; zoom: 1; margin: 0; min-height: 0 !important; height: auto; }
      body > :not(#printSheet) { display: none !important; }
      #printSheet { position: static; visibility: visible; zoom: var(--pz, 1); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="topnav">
      <a class="btn small" id="prevWeek">‹ 이전 주</a>
      <a class="btn small" id="thisWeek">이번 주</a>
      <a class="btn small" id="nextWeek">다음 주 ›</a>
      <span class="sp"></span>
      <a class="btn small ghost" href="race.html" target="_blank" rel="opener">🏃 마라톤</a>
      <a class="btn small ghost" href="index.html">📅 달력으로</a>
      <button class="btn small ghost" onclick="window.print()" title="이번 주 할 일을 A4 가로 한 장으로 인쇄">🖨 인쇄</button>
      <button class="btn small ghost" id="wkHelp" title="사용법">❓</button>
    </nav>

    <article class="paper sheet">
      <div class="rings"></div>
      <div class="tape"></div>
      <header class="head">
        <div class="date" id="weekTitle"></div>
        <div class="ddays" id="ddays"></div>
      </header>

      <!-- 집중 타이머: 고른 할 일에 집중 (끝나면 오늘 집중 시간으로 기록) -->
      <section class="wtimer timer-card" id="timerCard">
        <h3 class="section-title"><span class="hl">집중 타이머</span></h3>
        <select class="input" id="timerTask" aria-label="집중할 할 일"></select>
        <div class="modes" id="modes">
          <button class="btn small" data-m="25">25분</button>
          <button class="btn small" data-m="50">50분</button>
          <button class="btn small" data-m="5">휴식 5분</button>
        </div>
        <div class="t" id="tDisplay">25:00</div>
        <button class="btn primary small" id="tStart">▶ 시작</button>
        <button class="btn small" id="tReset">↺</button>
        <div class="noise">
          <span>🎧</span>
          <select class="input" id="noiseType" aria-label="백색소음 종류">
            <option value="off">백색소음 끄기</option>
            <option value="white">화이트 (쏴아)</option>
            <option value="pink">핑크 (부드럽게)</option>
            <option value="brown">브라운 (낮고 묵직)</option>
            <option value="rain">빗소리</option>
          </select>
          <input type="range" id="noiseVol" min="0" max="1" step="0.05" aria-label="음량" />
          <button class="btn small ghost" id="noiseTest" type="button">▶ 들어보기</button>
        </div>
        <div class="tbar"><i id="tBar"></i></div>
      </section>

      <div class="wk-scroll"><div class="wk" id="wk"></div></div>
    </article>
  </div>

  <!-- 인쇄 전용 (화면에서는 높이 계산용으로만 쓰임) -->
  <section id="printSheet" aria-hidden="true"></section>
  <div id="printRuler" aria-hidden="true"></div>

  <script src="noise.js"></script>
  <script src="week.js"></script>
</body>
</html>
